server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Cabeceras de seguridad. `always` para que salgan también en las respuestas
    # de error, donde nginx las omitiría.
    # OJO: `add_header` NO se hereda en un location que declare los suyos, así
    # que las que definen cabeceras propias más abajo repiten estas tres. Quitar
    # la repetición las deja sin protección sin que nada falle a la vista.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP: el token de sesión vive en localStorage, así que un XSS lo entregaría
    # entero. Esto acota de dónde puede salir el código que se ejecuta.
    # Las excepciones no son adorno, cada una sostiene algo que se usa:
    #   style-src 'unsafe-inline' + fonts.googleapis  -> la tipografía Inter y
    #     los estilos que React aplica en línea; sin ellos la app sale sin diseño.
    #   img-src blob:   -> la vista previa de la foto del producto antes de subirla.
    #   frame-src blob: -> el iframe oculto que imprime tickets y PDF.
    #   worker-src      -> el service worker de la PWA (/sw.js, mismo origen).
    # Si algo deja de verse tras un despliegue, sospechar de aquí primero.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de Docker. Sin esto nginx resuelve el upstream UNA vez, al
    # arrancar: si el backend todavía no existe no levanta, y si el contenedor
    # se recrea con otra IP se queda hablándole a la vieja. Con resolver +
    # variable en proxy_pass, la resolución es por petición.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El nombre lleva el prefijo del proyecto a propósito. En Dokploy todos los
    # stacks comparten `dokploy-network` y el DNS de Docker resuelve por nombre
    # en todas las redes: un servicio llamado "backend" podría resolver al
    # backend de OTRA app del servidor.
    set $xtrem_api http://xtrem-backend:8000;

    location /api/ {
        # Con variable, nginx reenvía el URI original completo (/api/v1/...).
        proxy_pass $xtrem_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Los PDF y el Excel de reportes tardan más que una consulta normal.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass $xtrem_api;
        proxy_set_header Host $host;
    }

    # Enlaces públicos cortos que sirve el backend, no la SPA: el PDF del
    # comprobante para WhatsApp (/c/{codigo}) y la página del QR de la ficha
    # (/f/{codigo}). Sin esto caen en index.html y el cliente ve el login.
    location /c/ {
        proxy_pass $xtrem_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /f/ {
        proxy_pass $xtrem_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # El index NO se cachea: si no, tras un deploy el navegador sigue pidiendo
    # los chunks viejos y la app queda rota hasta un refresco forzado.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
